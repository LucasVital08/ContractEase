server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Não anunciar a versão do nginx nas respostas/páginas de erro.
    server_tokens off;

    # ── Cabeçalhos de segurança ──────────────────────────────────────────
    # A aplicação só tinha CSP via <meta>, e <meta> não suporta
    # frame-ancestors: qualquer site conseguia embutir o ContractEase em um
    # iframe e aplicar clickjacking sobre a tela de assinatura, fazendo o
    # usuário assinar um contrato achando que clicava em outra coisa.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://code.iconify.design; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://ui-avatars.com https://*.supabase.co https://*.supabase.com; connect-src 'self' https://api.iconify.design https://api.simplesvg.com https://api.unisvg.com https://*.supabase.co https://*.supabase.com wss://*.supabase.co wss://*.supabase.com https://api.ipify.org https://horizon-testnet.stellar.org https://horizon.stellar.org https://soroban-testnet.stellar.org https://soroban-rpc.stellar.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
